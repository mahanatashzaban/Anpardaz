version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: anpardaz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Atash1365%
      POSTGRES_DB: payment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - anpardaz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anpardaz-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:Atash1365%25@postgres:5432/payment_db
      JWT_SECRET: your_super_secret_jwt_key_change_this_12345
      SMS_API_KEY: 3876794761642F4E4566617A634B386D5735396E485A653275513341446773644D4171677134724358476B3D
      KAVENEGAR_TEMPLATE: template
      KAVENEGAR_SENDER: 2000660110
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - anpardaz-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Nginx for Frontend
  nginx:
    image: nginx:alpine
    container_name: anpardaz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - anpardaz-network

volumes:
  postgres_data:

networks:
  anpardaz-network:
    driver: bridge
